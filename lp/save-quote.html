<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get a Free Insurance Quote & See How Much You Can Save</title>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0NYSKZRHFL"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-0NYSKZRHFL');
</script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#f2f6fb;
      color:#1a1a1a;
    }

    .hero{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:15px;
    }

    .container{
      max-width:1100px;
      width:100%;
      background:#fff;
      border-radius:18px;
      overflow:hidden;
      display:grid;
      grid-template-columns:1fr 1fr;
      box-shadow:0 12px 40px rgba(0,0,0,0.08);
    }

    .image{
      background:url('https://mathsinsure.com/img/save-quote.webp') center/cover no-repeat;
      min-height:430px;
    }

    .content{
      padding:45px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:14px;
    }

    .badge{
      background:#e8f3ff;
      color:#0a58ca;
      padding:6px 14px;
      border-radius:30px;
      font-size:13px;
      font-weight:bold;
      width:fit-content;
    }

    h1{
      font-size:40px;
      line-height:1.2;
      color:#0f2d4a;
    }

    p{
      font-size:16px;
      line-height:1.6;
      color:#555;
    }

    .buttons{
      display:flex;
      gap:12px;
      margin-top:10px;
    }

    .btn{
      text-decoration:none;
      padding:14px 22px;
      border-radius:10px;
      font-size:15px;
      font-weight:bold;
      transition:0.3s ease;
      text-align:center;
    }

    .btn-primary{
      background:#0a58ca;
      color:#fff;
    }

    .btn-primary:hover{
      background:#084298;
    }

    .btn-secondary{
      border:2px solid #0a58ca;
      color:#0a58ca;
      background:#fff;
    }

    .btn-secondary:hover{
      background:#0a58ca;
      color:#fff;
    }

    /* MOBILE */
    @media(max-width:900px){
      .container{
        grid-template-columns:1fr;
      }

      .image{
        min-height:220px;
      }

      .content{
        padding:25px;
      }

      h1{
        font-size:30px;
      }

      .buttons{
        flex-direction:column;
      }

      .btn{
        width:100%;
      }
    }
  </style>
</head>

<body>

  <section class="hero">
    <div class="container">

      <!-- Featured Image -->
      <div class="image"></div>

      <!-- Content -->
      <div class="content">

        <span class="badge">Instant Free Quote</span>

        <!-- SEO Title -->
        <h1>Get a Free Insurance Quote & See How Much You Can Save</h1>

        <!-- Short Description -->
        <p>
          Compare top insurance plans in minutes and discover how much you could save. Get your free, no-obligation quote online today with fast and simple approval.
        </p>

        <!-- Buttons -->
        <div class="buttons">
          <a href="https://mathsinsure.com/get-free-insurance-quote-save" class="btn btn-primary">Apply Now</a>
          <a href="https://mathsinsure.com/get-free-insurance-quote-save" class="btn btn-secondary">Learn More</a>
        </div>

      </div>

    </div>
  </section>

</body>
</html>
