<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Best Car Insurance for Low-Income Families in the U.S. 2026</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f7fb;
      color:#1a1a1a;
    }

    .hero{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:1100px;
      background:#fff;
      border-radius:18px;
      overflow:hidden;
      display:grid;
      grid-template-columns:1fr 1fr;
      box-shadow:0 12px 40px rgba(0,0,0,0.08);
    }

    .featured-image{
      background:url('https://mathsinsure.com/img/fam-lp.webp') center/cover no-repeat;
      min-height:420px;
    }

    .content{
      padding:45px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:15px;
    }

    .badge{
      display:inline-block;
      width:fit-content;
      background:#e8f3ff;
      color:#0a58ca;
      padding:6px 14px;
      border-radius:30px;
      font-size:13px;
      font-weight:700;
    }

    h1{
      font-size:40px;
      line-height:1.2;
      color:#0f2d4a;
    }

    p{
      font-size:16px;
      line-height:1.7;
      color:#555;
    }

    .buttons{
      display:flex;
      gap:12px;
      margin-top:10px;
    }

    .btn{
      text-decoration:none;
      padding:14px 24px;
      border-radius:10px;
      font-size:15px;
      font-weight:700;
      transition:.3s;
      text-align:center;
    }

    .btn-primary{
      background:#0a58ca;
      color:#fff;
    }

    .btn-primary:hover{
      background:#084298;
    }

    .btn-secondary{
      border:2px solid #0a58ca;
      color:#0a58ca;
      background:#fff;
    }

    .btn-secondary:hover{
      background:#0a58ca;
      color:#fff;
    }

    @media (max-width:900px){

      .container{
        grid-template-columns:1fr;
      }

      .featured-image{
        min-height:220px;
      }

      .content{
        padding:25px;
      }

      h1{
        font-size:30px;
      }

      .buttons{
        flex-direction:column;
      }

      .btn{
        width:100%;
      }
    }
  </style>
</head>

<body>

<section class="hero">

  <div class="container">

    <!-- Featured Image -->
    <div class="featured-image"></div>

    <!-- Content -->
    <div class="content">

      <span class="badge">2026 Savings Guide</span>

      <!-- SEO Title -->
      <h1>Best Car Insurance for Low-Income Families in the U.S. 2026</h1>

      <!-- Short Description -->
      <p>
        Compare affordable car insurance options designed to help families save money while maintaining reliable coverage. Get a free quote and discover lower rates in minutes.
      </p>

      <!-- CTA Buttons -->
      <div class="buttons">
        <a href="https://mathsinsure.com/best-car-insurance-low-income-families" class="btn btn-primary">Apply Now</a>
        <a href="https://mathsinsure.com/best-car-insurance-low-income-families" class="btn btn-secondary">Learn More</a>
      </div>

    </div>

  </div>

</section>

</body>
</html>
